services:
  - type: web
    name: hybrid-hpc-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: HPC_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hybrid-hpc-redis
          property: connectionString
  - type: worker
    name: hybrid-hpc-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerCommand: rq worker --url "$REDIS_URL"
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hybrid-hpc-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
  - type: keyvalue
    name: hybrid-hpc-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
