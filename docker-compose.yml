services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
  worker:
    build: .
    command: ["rq","worker","--url","redis://redis:6379/0"]
    environment:
      DATABASE_URL: postgresql://hpc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/hpc
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hpc
      POSTGRES_DB: hpc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U hpc"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  data:
