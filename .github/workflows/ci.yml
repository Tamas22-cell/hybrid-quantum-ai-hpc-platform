name: HPC CPU and MPI CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - run: pip install -r requirements-dev.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-hybrid.txt
      - run: python -m pytest -v
      - run: python -m benchmarks.quantum
      - run: python -m benchmarks.suite
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-results/
      - run: python -m cpu_engine --size 64 --repeats 3
      - run: python benchmarks/mpi_scaling.py > mpi-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: mpi-benchmark
          path: mpi-results.json

  cudaq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-cudaq.txt pytest
      - run: python -m pytest tests/test_quantum.py -v -k cudaq
      - run: python -m benchmarks.quantum --backend cudaq

  distributed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-distributed.txt pytest
      - run: python -m pytest tests/test_distributed.py -v
      - run: python -m benchmarks.distributed > ray-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: ray-benchmark
          path: ray-results.json

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-only-password
      HPC_API_KEY: ci-only-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-api.txt pytest
      - run: python -m pytest tests/test_api.py tests/test_security.py -v
      - run: docker compose up -d --build --wait
      - run: |
          set -eu
          curl --retry 10 --retry-connrefused -fsS http://localhost:8000/health
          id=$(curl -fsS -H 'X-API-Key: ci-only-key' -H 'Content-Type: application/json' -d '{"kind":"matrix","size":16}' http://localhost:8000/jobs | jq -r .id)
          for i in $(seq 1 30); do
            result=$(curl -fsS -H 'X-API-Key: ci-only-key' http://localhost:8000/jobs/$id)
            if echo "$result" | jq -e '.status == "finished" and .result.selected == "cpu"'; then exit 0; fi
            sleep 2
          done
          exit 1
      - if: always()
        run: docker compose logs && docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
